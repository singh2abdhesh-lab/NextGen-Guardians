name: Enterprise AI Guardian CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  # -------------------------------------------------------------
  # Job 1: Build & Verify Backend Multi-Module Microservices
  # -------------------------------------------------------------
  backend-build-and-test:
    name: Backend Build, Unit & Integration Tests (Java 17)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Eclipse Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Multi-Module Project & Execute Test Suite
        run: mvn clean verify -B -V

      - name: Generate JaCoCo Code Coverage Reports
        run: mvn jacoco:report -B

      - name: Upload JaCoCo Code Coverage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-reports
          path: '**/target/site/jacoco/'
          retention-days: 14

  # -------------------------------------------------------------
  # Job 2: Frontend Lint & Production Build
  # -------------------------------------------------------------
  frontend-build:
    name: Frontend Build & Asset Verification (Node.js 20)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package.json'

      - name: Install Dependencies
        run: npm install

      - name: Build Production SPA Bundle
        run: npm run build

      - name: Upload Frontend Production Build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-bundle
          path: ./frontend/dist/
          retention-days: 7

  # -------------------------------------------------------------
  # Job 3: Docker Container Build Verification
  # -------------------------------------------------------------
  docker-build-verify:
    name: Docker Containerization & Compose Validation
    runs-on: ubuntu-latest
    needs: [backend-build-and-test, frontend-build]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config --quiet

      - name: Build All 6 Microservice Images in Parallel
        run: docker compose build --parallel
