server:
  port: 8080

spring:
  application:
    name: ai-gateway
  main:
    allow-bean-definition-overriding: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true

ai:
  services:
    scanner-url: ${AI_SERVICES_SCANNER_URL:http://localhost:8081}
    risk-url: ${AI_SERVICES_RISK_URL:http://localhost:8082}
    audit-url: ${AI_SERVICES_AUDIT_URL:http://localhost:8083}
    quality-url: ${AI_SERVICES_QUALITY_URL:http://localhost:8084}
  upstream:
    mock: ${AI_UPSTREAM_MOCK:true}
    base-url: ${AI_UPSTREAM_BASE_URL:https://api.openai.com}
    api-key: ${AI_UPSTREAM_API_KEY:sk-placeholder}
    default-model: ${AI_UPSTREAM_DEFAULT_MODEL:gpt-4o}
    cost-per-1k-input: 0.0025
    cost-per-1k-output: 0.01
  kafka:
    enabled: ${KAFKA_ENABLED:false}
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    topic: ${KAFKA_AUDIT_TOPIC:ai-guardian-audit-events}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
